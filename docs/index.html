<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Análisis Estadístico - Instrumentos</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
}

canvas {
    background: white;
    border-radius: 10px;
}

.stats {
    display: flex;
    justify-content: space-around;
}

.stat {
    background: #334155;
    padding: 15px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>Análisis Estadístico de Instrumentos</h1>

<p>Este proyecto analiza datos de instrumentos musicales considerando peso, precio y tipo, aplicando medidas estadísticas y gráficas.</p>

<!-- ESTADÍSTICAS -->
<div class="stats">
    <div class="stat">
        <h3>Media</h3>
        <p id="media"></p>
    </div>
    <div class="stat">
        <h3>Mediana</h3>
        <p id="mediana"></p>
    </div>
    <div class="stat">
        <h3>Moda</h3>
        <p id="moda"></p>
    </div>
</div>

<!-- GRÁFICAS -->
<div class="container">

<div class="card">
    <h3>Frecuencia Absoluta</h3>
    <canvas id="barras"></canvas>
</div>

<div class="card">
    <h3>Frecuencia Relativa</h3>
    <canvas id="pastel"></canvas>
</div>

<div class="card">
    <h3>Frecuencia Acumulada</h3>
    <canvas id="acumulada"></canvas>
</div>

<div class="card">
    <h3>Polígono de Frecuencia (Peso)</h3>
    <canvas id="poligono"></canvas>
</div>

</div>

<script>
fetch("./resultados.json")
.then(res => res.json())
.then(data => {

    // =========================
    // MOSTRAR ESTADÍSTICAS
    // =========================
    document.getElementById("media").innerText =
        "Peso: " + data.media.peso.toFixed(2) +
        " | Precio: " + data.media.precio.toFixed(2);

    document.getElementById("mediana").innerText =
        "Peso: " + data.mediana.peso +
        " | Precio: " + data.mediana.precio;

    document.getElementById("moda").innerText =
        "Tipo: " + data.moda.tipo;

    // =========================
    // FRECUENCIAS
    // =========================
    const labels = Object.keys(data.frecuencia);
    const valores = Object.values(data.frecuencia);

    // BARRAS
    new Chart(document.getElementById("barras"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Frecuencia",
                data: valores
            }]
        }
    });

    // PASTEL
    new Chart(document.getElementById("pastel"), {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: Object.values(data.relativa)
            }]
        }
    });

    // ACUMULADA
    new Chart(document.getElementById("acumulada"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Acumulada",
                data: Object.values(data.acumulada)
            }]
        }
    });

    // =========================
    // POLÍGONO DE FRECUENCIA
    // =========================
    new Chart(document.getElementById("poligono"), {
        type: "line",
        data: {
            labels: data.peso,
            datasets: [{
                label: "Peso",
                data: data.peso
            }]
        }
    });

});
</script>

</body>
</html>
